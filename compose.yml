services:
  db:
    image: mysql:8.4
    container_name: inventory-management-db

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_management_system
      MYSQL_USER: sakib
      MYSQL_PASSWORD: 120316

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: